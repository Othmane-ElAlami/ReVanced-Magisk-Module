name: Build Modules
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Update config
        if: ${{ inputs.from_ci }}
        run: |
          if git checkout origin/update build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ "$UPDATE_CFG" ]; then
              echo "$UPDATE_CFG" > config.json
            fi
          fi

      - name: Get next version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -L 1 | awk -F '\t' '{print $3}')
          if [ -z "$TAG" ]; then TAG=0; fi
          echo "NEXT_VER_CODE=$((TAG + 1))" >> $GITHUB_OUTPUT

      - name: Build modules/APKs
        run: if [ -f "config.json" ]; then ./build.sh config.json; else ./build.sh config.toml; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}

      - name: Get output
        id: get_output
        run: |
          cp -f build.md build.tmp
          python3 .github/scripts/generate_release_notes.py
      
      - name: Upload release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          TITLE: ${{ steps.get_output.outputs.RELEASE_TITLE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          ls -lh ./build/*
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$BODY"
            gh release upload "$TAG" ./build/* --clobber
          else
            gh release create "$TAG" ./build/* --title "$TITLE" --notes "$BODY"
          fi

      - name: Update modules changelog and update json
        id: update_config
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Commit module json changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add build.md *-update.json
      
          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi

      - name: Report to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        if: env.TG_TOKEN != null
        run: |
          cd build || { echo "build folder not found"; exit 1; }

          escape_html() {
            sed -e 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g' <<<"$1"
          }

          TG_CHAT="@rvc_magisk"
          NL=$'\n'
          MAX_LEN=3500

          send_tg() {
            local text="$1"
            [ -z "$text" ] && return 0
            curl -sS --fail-with-body -X POST \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "disable_web_page_preview=true" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${text}" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          }

          MODULE_LINKS=()
          APK_LINKS=()
          for OUTPUT in *; do
            [ -f "$OUTPUT" ] || continue
            DL_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            ESCAPED_URL="$(escape_html "$DL_URL")"
            ESCAPED_NAME="$(escape_html "$OUTPUT")"
            LINK="📦<a href=\"${ESCAPED_URL}\">${ESCAPED_NAME}</a>"
            if [[ $OUTPUT = *.apk ]]; then
              APK_LINKS+=("$LINK")
            elif [[ $OUTPUT = *.zip ]]; then
              MODULE_LINKS+=("$LINK")
            fi
          done

          CURRENT_MSG="<b>New build!</b>"
          BODY="$(sed -e 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' ../build.md)"

          first_body_line=true
          while IFS= read -r line || [ -n "$line" ]; do
            if [ "$first_body_line" = true ]; then
              cand="${CURRENT_MSG}${NL}${NL}${line}"
              first_body_line=false
            else
              cand="${CURRENT_MSG}${NL}${line}"
            fi
            if [ ${#cand} -le $MAX_LEN ]; then
              CURRENT_MSG="$cand"
            else
              send_tg "$CURRENT_MSG"
              CURRENT_MSG="<b>New build (continued):</b>${NL}${NL}${line}"
            fi
          done <<< "$BODY"

          HAS_MODULES=false
          HAS_APKS=false
          [ ${#MODULE_LINKS[@]} -gt 0 ] && HAS_MODULES=true
          [ ${#APK_LINKS[@]} -gt 0 ] && HAS_APKS=true

          if [ "$HAS_MODULES" = true ] || [ "$HAS_APKS" = true ]; then
            if [ -n "$CURRENT_MSG" ] && [ $(( ${#CURRENT_MSG} + 250 )) -gt $MAX_LEN ]; then
              send_tg "$CURRENT_MSG"
              CURRENT_MSG=""
            fi

            if [ -z "$CURRENT_MSG" ]; then
              CURRENT_MSG="<b>▼ Download Links:</b>"
            else
              CURRENT_MSG+="${NL}${NL}<b>▼ Download Links:</b>"
            fi

            CONT_LINKS="<b>▼ Download Links (continued):</b>"

            if [ "$HAS_MODULES" = true ]; then
              first_mod=true
              for link in "${MODULE_LINKS[@]}"; do
                if [ "$first_mod" = true ]; then
                  item="Modules:${NL}${link}"
                  first_mod=false
                else
                  item="$link"
                fi
                if [ $(( ${#CURRENT_MSG} + 1 + ${#item} )) -le $MAX_LEN ]; then
                  CURRENT_MSG+="${NL}${item}"
                else
                  send_tg "$CURRENT_MSG"
                  CURRENT_MSG="${CONT_LINKS}${NL}${NL}${item}"
                fi
              done
            fi

            if [ "$HAS_APKS" = true ]; then
              first_apk=true
              for link in "${APK_LINKS[@]}"; do
                if [ "$first_apk" = true ]; then
                  if [ "$HAS_MODULES" = true ]; then
                    item="${NL}APKs:${NL}${link}"
                  else
                    item="APKs:${NL}${link}"
                  fi
                  first_apk=false
                else
                  item="$link"
                fi
                if [ $(( ${#CURRENT_MSG} + 1 + ${#item} )) -le $MAX_LEN ]; then
                  CURRENT_MSG+="${NL}${item}"
                else
                  send_tg "$CURRENT_MSG"
                  item="${item#"${NL}"}"
                  CURRENT_MSG="${CONT_LINKS}${NL}${NL}${item}"
                fi
              done
            fi
          fi

          if [ -n "$CURRENT_MSG" ]; then
            send_tg "$CURRENT_MSG"
          fi
